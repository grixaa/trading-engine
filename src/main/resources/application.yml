server:
  port: ${TRADING_HTTP_PORT:}

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${TRADING_DB_URL:}
    username: ${TRADING_DB_USER:}
    password: ${TRADING_DB_PASSWORD:}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.spvb.tradingengine: ${TRADING_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [requestId=%X{requestId:--}]"
